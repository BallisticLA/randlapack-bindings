[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "randlapack"
version = "0.0.1"
description = "Python bindings for selected RandLAPACK drivers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest", "scipy>=1.10"]
bench = ["scipy>=1.10"]

[tool.scikit-build]
wheel.packages = ["randlapack"]
cmake.version = ">=3.20"
